[build]
  command = npm run build
  publish = dist/public

[[redirects]]
  from = /*
  to = /index.html
  status = 200

[[headers]]
  for = /*
  [headers.values]
    X-Frame-Options = DENY
    X-Content-Type-Options = nosniff
    Referrer-Policy = strict-origin-when-cross-origin

[[headers]]
  for = /assets/*
  [headers.values]
    Cache-Control = public, max-age=31536000, immutable

[[headers]]
  for = /manus-storage/*
  [headers.values]
    Cache-Control = public, max-age=31536000, immutable
